name: OrcaCode Review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

on:
  # Paid external reviews are opt-in; deterministic tests remain automatic.
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (startsWith(github.event.comment.body, '/orcacode-review') ||
          startsWith(github.event.comment.body, '/orcacode review') ||
          github.event.comment.body == '@orcacode-review' ||
          github.event.comment.body == '@orcacode review' ||
          startsWith(github.event.comment.body, '@orcacode-review ') ||
          startsWith(github.event.comment.body, '@orcacode review ')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    env:
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
    steps:
      - name: Skip optional review without credentials
        if: ${{ env.ORCAROUTER_API_KEY == '' }}
        run: echo "Optional Orca review skipped; API key is not configured."
      - uses: Continuum-AI-Corp/orca-code-review@5ecfbf339ccbe5e6a6107259e0369d424846deb4
        if: ${{ env.ORCAROUTER_API_KEY != '' }}
        with:
          orcarouter-api-key: ${{ secrets.ORCAROUTER_API_KEY }}
