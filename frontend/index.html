<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智研 AI 法律系統</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
</head>
<body>
  <!-- 側邊欄 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">⚖️</span>
        <div class="logo-text">
          <h1>智研</h1>
          <span class="logo-sub">台灣法律研究助手</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn active" data-mode="chat">
        <span>💬</span> 查法律問題
      </button>
      <button class="nav-btn" onclick="newChat()">
        <span>🆕</span> 新對話
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="status-badge" id="statusBadge">
        <span class="status-dot"></span>
        <span id="statusText">連線中...</span>
      </div>
      <div class="version-info">研究工具，不取代律師</div>
    </div>
  </aside>

  <!-- 主內容 -->
  <main class="main-content" id="mainContent">
    <!-- 頂欄 -->
    <header class="topbar">
      <button class="mobile-menu-btn" id="menuToggle" aria-label="選單">☰</button>
      <div class="topbar-info">
        <span class="topbar-title">⚖️ 查法律問題</span>
        <span class="topbar-model">回答附上可核對線索</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="newChat()" title="新對話">🆕</button>
      </div>
    </header>

    <!-- 對話區 -->
    <div class="chat-area" id="chatArea">
      <!-- 歡迎畫面 -->
      <div class="welcome" id="welcome">
        <div class="welcome-content">
          <div class="welcome-text">
            <div class="welcome-icon">⚖️</div>
            <h2>先找依據，再回答法律問題</h2>
            <p class="welcome-desc">
              智研幫你整理問題、說明依據，也會指出資料不足或需要人工確認的地方，降低把不確定答案當成法律事實的風險。
            </p>
            <ul class="welcome-promises" aria-label="智研的回答原則">
              <li>看得懂：用一般用語說明法律重點</li>
              <li>查得到：有來源時提供可核對的引用</li>
              <li>不硬猜：資料不足時明確告訴你</li>
            </ul>
            <div class="welcome-suggestions">
              <button class="suggestion-chip" onclick="askSuggest(this)">
                公然侮辱罪的構成要件是什麼？
              </button>
              <button class="suggestion-chip" onclick="askSuggest(this)">
                離婚訴訟需要準備哪些文件？
              </button>
              <button class="suggestion-chip" onclick="askSuggest(this)">
                車禍後如何申請保險理賠？
              </button>
              <button class="suggestion-chip" onclick="askSuggest(this)">
                勞動契約終止的合法程序
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- 訊息列表 -->
      <div class="messages" id="messages"></div>
    </div>

    <!-- 輸入區 -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="messageInput"
          class="message-input"
          placeholder="請描述發生了什麼事、時間及你想了解的問題..."
          rows="1"
          oninput="autoResize(this)"
          onkeydown="handleKeydown(event)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
          <span>➤</span>
        </button>
      </div>
      <div class="input-footer">
        <span class="input-hint">Enter 送出 · Shift+Enter 換行</span>
        <span class="input-disclaimer">重要權益請再由律師或主管機關確認</span>
      </div>
    </div>
  </main>

  <!-- 載入動畫 -->
  <div class="loading-overlay" id="loadingOverlay" style="display:none">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <span>正在整理問題與核對依據...</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
