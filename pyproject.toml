[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "zhiyan-legal"
version = "3.7.2"
description = "智研AI法律工作站 — A reproducible study of citation-grounding and safety-routing for legal LLMs"
authors = [
    {name = "Lucien", email = "ysga1127@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]
keywords = [
    "citation-grounding",
    "hallucination-mitigation",
    "legal-ai",
    "responsible-ai",
    "taiwan-law",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Legal Industry",
]

[project.optional-dependencies]
committee = [
    "google-genai>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]
docgen = [
    "python-docx>=1.1.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]
sdk = []
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
]
all = [
    "fastapi>=0.110.0",
    "google-genai>=1.0.0",
    "PyYAML>=6.0",
    "python-docx>=1.1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "requests>=2.31.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
zhiyan-legal = "zhiyan_legal.cli:main"

[project.urls]
Homepage = "https://lucien-1127.github.io/zhiyan-legal/"
Documentation = "https://lucien-1127.github.io/zhiyan-legal/"
Repository = "https://github.com/Lucien-1127/zhiyan-legal"
Issues = "https://github.com/Lucien-1127/zhiyan-legal/issues"
Changelog = "https://github.com/Lucien-1127/zhiyan-legal/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
